<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Trang không tìm thấy | AURA LUXE TECH</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%23d4af37'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #09090b;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-pure: #fff;
      --text-dim: #6b7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: var(--bg-base);
      color: var(--text-pure);
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      padding: 20px;
    }
    .icon-404 {
      font-size: 64px;
      color: var(--gold);
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: var(--gold-light);
      margin-bottom: 12px;
    }
    p {
      color: var(--text-dim);
      font-size: 1.1rem;
      margin-bottom: 28px;
      max-width: 440px;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: #000;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    a:hover {
      background: var(--gold-light);
      box-shadow: 0 4px 20px rgba(212,175,55,0.3);
      transform: translateY(-2px);
    }
    .brand-footer {
      position: fixed;
      bottom: 24px;
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="icon-404">✦</div>
  <h1>404</h1>
  <p>Xin lỗi, trang bạn đang tìm không tồn tại hoặc đã được di chuyển. Hãy quay lại trang chủ để khám phá bộ sưu tập công nghệ đẳng cấp.</p>
  <a href="/">← Quay về trang chủ</a>
  <span class="brand-footer">AURA LUXE TECH</span>
</body>
</html>
